name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CyberTrack 12 APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.keshavgehlot --project-name cybertrack12 .
          fi

      - name: Configure Android notifications
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if 'android.permission.RECORD_AUDIO' not in text:
              text = text.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
                  '    <queries><intent><action android:name="android.speech.RecognitionService"/></intent>'
                  '<intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>\n    <application',
                  1,
              )
          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.INTERNET"/>\n    <application',
                  1,
              )
          if 'android.permission.RECEIVE_BOOT_COMPLETED' not in text:
              text = text.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application',
                  1,
              )
          if 'ScheduledNotificationReceiver' not in text:
              text = text.replace(
                  '</application>',
                  '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>\n'
                  '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">'
                  '<intent-filter>'
                  '<action android:name="android.intent.action.BOOT_COMPLETED"/>'
                  '<action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>'
                  '<action android:name="android.intent.action.QUICKBOOT_POWERON"/>'
                  '<action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>'
                  '</intent-filter></receiver>\n'
                  '</application>',
                  1,
              )
          if 'login-callback' not in text:
              text = text.replace(
                  '</activity>',
                  '    <intent-filter>'
                  '<action android:name="android.intent.action.VIEW"/>'
                  '<category android:name="android.intent.category.DEFAULT"/>'
                  '<category android:name="android.intent.category.BROWSABLE"/>'
                  '<data android:scheme="com.keshavgehlot.cybertrack12" android:host="login-callback"/>'
                  '</intent-filter>\n        </activity>',
                  1,
              )
          text = text.replace('android:label="cybertrack12"', 'android:label="CyberTrack 12"')
          manifest.write_text(text)

          gradle = Path("android/app/build.gradle.kts")
          g = gradle.read_text()
          g = g.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 37')
          g = g.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          if 'isCoreLibraryDesugaringEnabled = true' not in g:
              g = g.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in g:
              # Flutter's generated Kotlin DSL template may omit a dependencies block.
              # Append an explicit block so AGP's desugaring configuration is never empty.
              g += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          # Optional stable signing key (from the KEYSTORE_BASE64 secret) so
          # every build can update the previous install in place.
          import os
          if os.environ.get("KEYSTORE_BASE64") and 'signingConfigs.getByName("release_key")' not in g:
              g = g.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release_key")')
              g = g.replace('android {', 'android {\n    signingConfigs {\n        create("release_key") {\n            storeFile = file("upload.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEYSTORE_PASSWORD")\n        }\n    }', 1)
          if 'checkReleaseBuilds' not in g:
              g = g.replace('android {', 'android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }', 1)
          gradle.write_text(g)

          # Flutter 3.50 generates the modern AGP 9.3 / Gradle 9.5 Android template.
          settings = Path("android/settings.gradle.kts")
          if settings.exists():
              print("Using generated Flutter Android plugin DSL:")
              print(settings.read_text())
          PY

      - name: Install signing key (if provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks; fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-pub --no-fatal-infos

      - name: Unit tests
        run: rm -f test/widget_test.dart && flutter test --no-pub test/

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=APP_BUILD="build-${{ github.run_number }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cybertrack12-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk CyberTrack12.apk
          tag="build-${{ github.run_number }}"
          gh release create "$tag" CyberTrack12.apk \
            --title "CyberTrack 12 build ${{ github.run_number }}" \
            --notes "Release APK from commit ${{ github.sha }}. Install over the previous build when the signing secrets are set. Emulator screenshots are attached when the screenshot step succeeds."

      - name: Enable KVM for the emulator
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator screenshots
        id: shots
        continue-on-error: true
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: flutter drive --no-pub --driver=test_driver/integration_test.dart --target=integration_test/app_screens_test.dart

      - name: Attach screenshots to the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls screenshots/*.png >/dev/null 2>&1; then
            gh release upload "build-${{ github.run_number }}" screenshots/*.png --clobber
            echo "Screenshots: $(ls screenshots)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No screenshots were produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build summary
        run: |
          echo "## CyberTrack 12 APK" >> "$GITHUB_STEP_SUMMARY"
          echo "The release-mode APK is available in this workflow's Artifacts section as **cybertrack12-android-apk**." >> "$GITHUB_STEP_SUMMARY"
          echo "Cloud sync is enabled only when SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository variables are configured." >> "$GITHUB_STEP_SUMMARY"
